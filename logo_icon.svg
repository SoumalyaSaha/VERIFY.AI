<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#0e2a38"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ff2ff"/>
      <stop offset="100%" stop-color="#22c9e5"/>
    </linearGradient>
  </defs>

  <!-- background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" stroke="#22e5ff" stroke-width="4" opacity="0.98"/>

  <!-- shield outline -->
  <path d="M256 80 L392 128 V244 C392 336 330 400 256 432 C182 400 120 336 120 244 V128 Z"
        fill="none" stroke="url(#cyan)" stroke-width="10" stroke-linejoin="round"/>

  <!-- inner scan lines (forensic sweep) -->
  <g stroke="#22e5ff" stroke-width="2" opacity="0.35">
    <line x1="140" y1="180" x2="372" y2="180"/>
    <line x1="140" y1="220" x2="372" y2="220"/>
    <line x1="140" y1="300" x2="372" y2="300"/>
    <line x1="140" y1="340" x2="372" y2="340"/>
  </g>

  <!-- central eye / lens -->
  <ellipse cx="256" cy="256" rx="86" ry="52" fill="none" stroke="url(#cyan)" stroke-width="8"/>
  <circle cx="256" cy="256" r="34" fill="#04141c" stroke="url(#cyan)" stroke-width="8"/>
  <circle cx="256" cy="256" r="12" fill="#7ff2ff"/>

  <!-- checkmark integrated into lens sweep -->
  <path d="M204 258 L238 292 L316 206" fill="none" stroke="#7ff2ff" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- corner scan brackets -->
  <g stroke="#22e5ff" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M150 150 L150 180 M150 150 L180 150"/>
    <path d="M362 150 L362 180 M362 150 L332 150"/>
    <path d="M150 362 L150 332 M150 362 L180 362"/>
    <path d="M362 362 L362 332 M362 362 L332 362"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="480" font-family="'Courier New', monospace" font-size="34" font-weight="bold"
        fill="#eaffff" text-anchor="middle" letter-spacing="4">VERIFY.AI</text>
</svg>
