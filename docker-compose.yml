services:

  # ── Gateway ──────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - NPR_URL=http://npr:5001/detect
      - UFD_URL=http://ufd:5004/detect
      - IAPL_URL=http://iapl:5005/detect
      - SDXL_URL=http://sdxl:5009/detect
      - UMM_URL=http://umm:5010/detect
      - CAP_URL=http://capcheck:5011/detect
      - NONE_URL=http://nonescape:5013/detect
    volumes:
      - gateway-logs:/app/logs
      - gateway-thumbs:/app/thumbnails
    depends_on:
      - npr
      - ufd
      - iapl
      - sdxl
      - umm
      - capcheck
      - nonescape

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  # ── All 7 models share the same image, different WORKDIR + CMD ──────────────
  npr:
    image: verifyai-model
    build:
      context: .
      dockerfile: Dockerfile.model
    ports:
      - "5001:5001"
    working_dir: /app/models/npr
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5001
    volumes:
      - ./weights:/app/weights:ro
      - hf-cache:/app/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ufd:
    image: verifyai-model
    ports:
      - "5004:5004"
    working_dir: /app/models/ufd
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5004
    volumes:
      - ./weights:/app/weights:ro
      - hf-cache:/app/hf_cache
      - clip-cache:/app/cache/clip
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  iapl:
    image: verifyai-model
    ports:
      - "5005:5005"
    working_dir: /app/models/iapl
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5005
    volumes:
      - ./weights:/app/weights:ro
      - hf-cache:/app/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sdxl:
    image: verifyai-model
    ports:
      - "5009:5009"
    working_dir: /app/models/sdxl_detector
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5009
    volumes:
      - hf-cache:/app/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  umm:
    image: verifyai-model
    ports:
      - "5010:5010"
    working_dir: /app/models/umm_maybe
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5010
    volumes:
      - hf-cache:/app/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  capcheck:
    image: verifyai-model
    ports:
      - "5011:5011"
    working_dir: /app/models/capcheck
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5011
    volumes:
      - hf-cache:/app/hf_cache

  nonescape:
    image: verifyai-model
    ports:
      - "5013:5013"
    working_dir: /app/models/nonescape
    command: python -m uvicorn main:app --host 0.0.0.0 --port 5013
    volumes:
      - ./weights:/app/weights:ro
      - hf-cache:/app/hf_cache

volumes:
  hf-cache:
  clip-cache:
  gateway-logs:
  gateway-thumbs:
